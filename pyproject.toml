[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-context-engine"
version = "0.1.0"
description = "Privacy-first, self-hosted codebase context engine for AI coding assistants"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Local Context Engine Contributors" }]
keywords = ["AI", "code-indexing", "embeddings", "MCP", "privacy", "local", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # Async
    "anyio>=4.4.0",
    "aiofiles>=23.2.1",
    "aiosqlite>=0.20.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",

    # Tree-sitter code parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-php>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-css>=0.23.0",

    # Embeddings (all local, no cloud)
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    "transformers>=4.41.0",
    "numpy>=1.26.0",

    # Vector store
    "faiss-cpu>=1.8.0",

    # Retrieval
    "rank-bm25>=0.2.2",

    # Symbol graph
    "networkx>=3.3",

    # MCP Server
    "fastmcp>=2.0.0",

    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",

    # File system
    "watchdog>=4.0.0",
    "pathspec>=0.12.1",
    "aiofiles>=23.2.1",

    # Security / PII
    "regex>=2024.5.15",

    # HTTP (optional web dashboard)
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gpu = ["faiss-gpu>=1.8.0"]

web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
]

dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
context = "local_context_engine.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_context_engine"]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/local_context_engine"]
omit = ["*/tests/*", "*/migrations/*"]
